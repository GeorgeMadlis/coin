[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coin-kb"
version = "0.1.0"
description = "COIN — ConnectedInformation: an LLM-compiled knowledge base for ConnectedNature"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "George Madlis" }]
requires-python = ">=3.11"
keywords = ["llm", "knowledge-base", "wiki", "rag", "ai", "connectednature"]

dependencies = [
    # Core LLM providers (agent mode)
    "anthropic>=0.25",
    "openai>=1.20",
    "ollama>=0.2",

    # Embeddings & vector search
    "sqlite-vss>=0.1.2",
    "numpy>=1.26",

    # Ingestion
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "openai-whisper>=20231117",
    "yt-dlp>=2024.4",
    "youtube-transcript-api>=0.6.2",

    # NLP
    "spacy>=3.7",

    # Knowledge graph
    "networkx>=3.3",

    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",

    # Scheduling
    "apscheduler>=3.10",

    # Export
    "weasyprint>=62",
    "python-pptx>=1.0",

    # CLI
    "typer[all]>=0.12",
    "rich>=13",

    # Config
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # Async SQLite
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
    "ruff>=0.4",
    "black>=24",
    "mypy>=1.9",
]

[project.scripts]
coin = "coin.cli:app"

[project.urls]
Homepage = "https://github.com/GeorgeMadlis/coin"
Repository = "https://github.com/GeorgeMadlis/coin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["coin"]
